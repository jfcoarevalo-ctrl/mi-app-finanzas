<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Gestor Financiero V3</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e2f; --text-color: #e0e0e0; --accent-green: #00d26a; --accent-red: #f73859; --accent-blue: #3d84ff; --input-bg: #2c2c44; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; min-height: 100vh; padding: 20px; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
        .container { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr; gap: 20px; padding-bottom: 50px; }
        @media(min-width: 768px) { .container { grid-template-columns: 1fr 1fr; } .header, .stats, .recommendation-box, .toolbar { grid-column: span 2; } }
        .header { text-align: center; margin-bottom: 10px; margin-top: 10px; }
        .header h1 { font-weight: 600; background: linear-gradient(90deg, #3d84ff, #00d26a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; }
        .card { background-color: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.1rem; margin-bottom: 15px; color: #8f90a6; border-left: 3px solid var(--accent-blue); padding-left: 10px; }
        
        .toolbar { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;}
        .btn-tool { flex: 1; background-color: #2c2c44; color: white; padding: 12px; border: 1px solid #3d84ff; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 500; min-width: 100px; display:flex; align-items:center; justify-content:center; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: #8f90a6; }
        input, select { width: 100%; padding: 14px; background-color: var(--input-bg); border: 1px solid transparent; border-radius: 8px; color: white; font-size: 1rem; margin-bottom: 10px; appearance: none; }
        input:focus, select:focus { outline: none; border-color: var(--accent-blue); }
        
        button.action-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: transform 0.1s; opacity: 1; }
        button.action-btn:active { transform: scale(0.96); }
        button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; background-color: #555 !important; color: #aaa !important; }
        
        .btn-income { background-color: var(--accent-blue); color: white; }
        .btn-expense { background-color: var(--accent-red); color: white; margin-top: 5px;}
        
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stat-item { background: var(--card-bg); padding: 12px 5px; border-radius: 12px; text-align: center; border: 1px solid #2c2c44; }
        .stat-label { font-size: 0.75rem; color: #8f90a6; }
        .stat-value { font-size: 1.1rem; font-weight: bold; margin-top: 5px; word-wrap: break-word;}
        .val-green { color: var(--accent-green); }
        .val-red { color: var(--accent-red); }
        .val-white { color: white; }
        
        .chart-container { position: relative; height: 220px; width: 100%; }
        
        .list-container { max-height: 250px; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-bottom: 10px;}
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #2c2c44; font-size: 0.9rem; }
        .list-info { display: flex; flex-direction: column; text-align: left; }
        .list-meta { font-size: 0.75rem; color: #8f90a6; margin-top: 2px; }
        .tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-left: 5px; background: #2c2c44; border: 1px solid #555; }
        
        .sync-status { position: fixed; bottom: 10px; right: 10px; width: 12px; height: 12px; background: gray; border-radius: 50%; border: 2px solid #121212; z-index: 100; }
        .sync-active { background: #00d26a; box-shadow: 0 0 10px #00d26a; }
        .recommendation-box { padding: 15px; border-radius: 12px; text-align: center; font-weight: 600; background-color: #2c2c44; font-size: 0.95rem; line-height: 1.4;}

        /* Modal & PDF */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 9999; }
        .modal-content { background: var(--card-bg); color: var(--text-color); width: 95%; max-width: 700px; padding: 25px; border-radius: 12px; max-height: 90vh; overflow-y: auto; border: 1px solid #3d84ff; }
        
        /* ESTILOS REPORTE PDF - Limpieza visual */
        #pdfExportArea { 
            display: block; 
            width: 100%; 
            margin: 0 auto; 
            text-align: center; 
            background-color: #1e1e2f; 
            color: #ffffff !important; 
            padding: 20px; 
            border-radius: 8px;
        }
        #pdfExportArea * { color: #ffffff !important; }
        
        .report-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #3d84ff; padding-bottom: 15px; }
        .report-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; text-align: center; }
        .report-box { background: #121212; padding: 10px; border-radius: 8px; border: 1px solid #333; }
        
        .section-title { text-align: left; margin-top: 15px; margin-bottom: 5px; color: #3d84ff !important; font-size: 0.9rem; font-weight: bold; border-bottom: 1px solid #444; }
        .preview-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.8rem; }
        .preview-table th { background-color: #3d84ff; padding: 8px; text-align: left; color: white !important; }
        .preview-table td { border-bottom: 1px solid #444; padding: 8px; text-align: left; color: white !important; }
        
        @media print { body { background-color: #121212 !important; } .container, button, .sync-status { display: none !important; } .modal-overlay { display: block !important; position: static; } .modal-content { border:none; width: 100%; } }
    </style>
</head>
<body>

    <div id="syncIndicator" class="sync-status" title="Sincronizado"></div>

    <div class="container">
        <div class="header">
            <h1>Gestor V3 💎</h1>
            <p>Categorías y Múltiples Ingresos</p>
        </div>

        <div class="toolbar">
            <button class="btn-tool" onclick="resetData()">🗑️ Reset</button>
            <button class="btn-tool" onclick="openPreview()">📄 Reporte</button>
        </div>

        <div class="stats">
            <div class="stat-item"><div class="stat-label">Ingresos</div><div class="stat-value val-green" id="displayIncome">---</div></div>
            <div class="stat-item"><div class="stat-label">Gastos</div><div class="stat-value val-red" id="displayExpenses">---</div></div>
            <div class="stat-item"><div class="stat-label">Neto</div><div class="stat-value val-white" id="displayBalance">---</div></div>
        </div>

        <!-- SECCIÓN DE INGRESOS -->
        <div class="card">
            <h2 style="border-left-color: var(--accent-green);">Ingresos (Entradas)</h2>
            <div class="list-container" id="incomesList"></div>
            <hr style="border-color: #2c2c44; margin: 10px 0;">
            <div class="input-group">
                <input type="text" id="incDesc" placeholder="Fuente (Ej: Proyecto Web)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <input type="number" id="incAmount" placeholder="$ Monto">
                    <select id="incCat">
                        <option value="Sueldo">Sueldo</option>
                        <option value="Negocio">Negocio</option>
                        <option value="Inversión">Inversión</option>
                        <option value="Préstamo">Préstamo</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <input type="date" id="incDate">
                <button class="action-btn btn-income" id="btnAddIncome" onclick="addIncome()" disabled>+ Agregar Ingreso</button>
            </div>
        </div>

        <!-- SECCIÓN DE GASTOS -->
        <div class="card">
            <h2 style="border-left-color: var(--accent-red);">Gastos (Salidas)</h2>
            <div class="input-group">
                <input type="text" id="expDesc" placeholder="Concepto (Ej: Supermercado)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <input type="number" id="expAmount" placeholder="$ Monto">
                    <select id="expCat">
                        <option value="Hogar">Hogar</option>
                        <option value="Comida">Comida</option>
                        <option value="Transporte">Transporte</option>
                        <option value="Deudas">Deudas</option>
                        <option value="Ocio">Ocio</option>
                        <option value="Salud">Salud</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <input type="date" id="expDate">
                <button class="action-btn btn-expense" id="btnAddExpense" onclick="addExpense()" disabled>- Agregar Gasto</button>
            </div>
            <div class="list-container" id="expensesList"></div>
        </div>

        <div class="card">
            <h2>Balance Visual</h2>
            <div class="chart-container"><canvas id="budgetChart"></canvas></div>
        </div>
        
        <div class="recommendation-box" id="recommendation">Conectando...</div>
    </div>

    <!-- MODAL PDF -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-content">
            <div id="pdfExportArea">
                <div class="report-header">
                    <h2>REPORTE FINANCIERO V3</h2>
                    <p style="font-size:0.8rem; color:#ccc !important;" id="reportDate">Fecha: </p>
                </div>
                <div class="report-summary">
                    <div class="report-box" style="border: 1px solid #00d26a;"><div style="font-size:0.7rem; color:#00d26a !important;">INGRESOS</div><div id="repInc" style="font-weight:bold; font-size:0.9rem;">$0</div></div>
                    <div class="report-box" style="border: 1px solid #f73859;"><div style="font-size:0.7rem; color:#f73859 !important;">GASTOS</div><div id="repExp" style="font-weight:bold; font-size:0.9rem;">$0</div></div>
                    <div class="report-box" style="border: 1px solid #3d84ff;"><div style="font-size:0.7rem; color:#3d84ff !important;">NETO</div><div id="repBal" style="font-weight:bold; font-size:0.9rem;">$0</div></div>
                </div>

                <div class="section-title">DETALLE DE INGRESOS</div>
                <div id="incomesTableBody"></div>

                <div class="section-title" style="margin-top:20px;">DETALLE DE GASTOS</div>
                <div id="expensesTableBody"></div>
            </div>
            
            <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
                <button onclick="downloadPDF()" style="flex:1; padding:12px; background:#f73859; color:white; border:none; border-radius:8px; font-weight:600; cursor:pointer;">📥 Descargar PDF</button>
                <button onclick="closePreview()" style="flex:1; padding:12px; background:#2c2c44; color:white; border:1px solid #555; border-radius:8px; cursor:pointer;">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCUW8mkor6lzFomj2ethMM9sHuMyRuvY_Q",
            authDomain: "appfinanzas-cc8aa.firebaseapp.com",
            projectId: "appfinanzas-cc8aa",
            storageBucket: "appfinanzas-cc8aa.firebasestorage.app",
            messagingSenderId: "621532467032",
            appId: "1:621532467032:web:e7b1ab3f70b970b9839f2d"
        };

        let db;
        let dataLoaded = false;
        try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch (e) { console.error(e); }

        let incomesArr = [];
        let expensesArr = [];
        const moneyFormat = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
        const syncIndicator = document.getElementById('syncIndicator');

        const btnAddIncome = document.getElementById('btnAddIncome');
        const btnAddExpense = document.getElementById('btnAddExpense');

        const ctx = document.getElementById('budgetChart').getContext('2d');
        let myChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Ingresos', 'Gastos', 'Libre'], datasets: [{ data: [0, 0, 0], backgroundColor: ['#00d26a', '#f73859', '#3d84ff'], borderRadius: 6 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#2c2c44' }, ticks: { color: '#8f90a6' } }, x: { grid: { display: false }, ticks: { color: '#e0e0e0' } } } }
        });

        if(db) {
            db.collection("finanzas").doc("mi_presupuesto").onSnapshot((doc) => {
                dataLoaded = true;
                enableButtons();
                if (doc.exists) {
                    const data = doc.data();
                    if (data.income !== undefined && !data.incomes) {
                        incomesArr = [{ desc: "Saldo Anterior", amount: data.income, date: new Date().toISOString().split('T')[0], category: "Otro" }];
                    } else {
                        incomesArr = data.incomes || [];
                    }
                    expensesArr = data.expenses || [];
                    updateUI();
                    syncIndicator.classList.add('sync-active');
                    document.getElementById('recommendation').innerText = "V3 Conectado.";
                    document.getElementById('recommendation').style.color = "#00d26a";
                } else {
                    incomesArr = []; expensesArr = []; updateUI();
                }
            }, (error) => {
                document.getElementById('recommendation').innerText = "⚠️ Error conexión.";
                disableButtons();
            });
        }

        function enableButtons() { btnAddIncome.disabled = false; btnAddIncome.innerText = "+ Agregar Ingreso"; btnAddExpense.disabled = false; btnAddExpense.innerText = "- Agregar Gasto"; }
        function disableButtons() { btnAddIncome.disabled = true; btnAddExpense.disabled = true; }

        function saveToCloud() {
            if(!db || !dataLoaded) return alert("Espera carga...");
            syncIndicator.classList.remove('sync-active');
            db.collection("finanzas").doc("mi_presupuesto").set({
                incomes: incomesArr,
                expenses: expensesArr,
                lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => { syncIndicator.classList.add('sync-active'); }).catch((e) => alert("Error guardar"));
        }

        function addIncome() {
            if(!dataLoaded) return;
            const desc = document.getElementById('incDesc').value;
            const amount = parseFloat(document.getElementById('incAmount').value);
            const cat = document.getElementById('incCat').value;
            const date = document.getElementById('incDate').value;

            if(!desc || isNaN(amount) || amount <= 0 || !date) return alert("Completa datos de ingreso");

            incomesArr.push({ desc, amount, category: cat, date });
            document.getElementById('incDesc').value = '';
            document.getElementById('incAmount').value = '';
            document.getElementById('incDate').value = '';
            saveToCloud();
        }

        function addExpense() {
            if(!dataLoaded) return;
            const desc = document.getElementById('expDesc').value;
            const amount = parseFloat(document.getElementById('expenseAmount').value);
            const cat = document.getElementById('expCat').value;
            const date = document.getElementById('expDate').value;

            if(!desc || isNaN(amount) || amount <= 0 || !date) return alert("Completa datos de gasto");

            expensesArr.push({ desc, amount, category: cat, date });
            document.getElementById('expDesc').value = '';
            document.getElementById('expenseAmount').value = '';
            document.getElementById('expDate').value = '';
            saveToCloud();
        }

        function resetData() {
            if(confirm("¿Borrar TODO (Ingresos y Gastos)?")) { incomesArr=[]; expensesArr=[]; saveToCloud(); }
        }

        function renderLists() {
            const incList = document.getElementById('incomesList'); incList.innerHTML = '';
            const sortedInc = [...incomesArr].reverse();
            if(sortedInc.length===0) incList.innerHTML = '<div style="text-align:center;color:#555">Sin ingresos</div>';
            else {
                sortedInc.forEach(item => {
                    const d = new Date(item.date + 'T00:00:00').toLocaleDateString('es-ES', {day:'numeric', month:'short'});
                    incList.innerHTML += `
                        <div class="list-item">
                            <div class="list-info">
                                <span style="font-weight:600">${item.desc} <span class="tag" style="color:#00d26a">${item.category || 'Gral'}</span></span>
                                <span class="list-meta">📅 ${d}</span>
                            </div>
                            <span style="color:var(--accent-green);font-weight:bold">+${moneyFormat.format(item.amount)}</span>
                        </div>`;
                });
            }

            const expList = document.getElementById('expensesList'); expList.innerHTML = '';
            const sortedExp = [...expensesArr].reverse();
            if(sortedExp.length===0) expList.innerHTML = '<div style="text-align:center;color:#555">Sin gastos</div>';
            else {
                sortedExp.forEach(item => {
                    const d = new Date(item.date + 'T00:00:00').toLocaleDateString('es-ES', {day:'numeric', month:'short'});
                    expList.innerHTML += `
                        <div class="list-item">
                            <div class="list-info">
                                <span style="font-weight:600">${item.desc} <span class="tag" style="color:#f73859">${item.category || 'Gral'}</span></span>
                                <span class="list-meta">📅 ${d}</span>
                            </div>
                            <span style="color:var(--accent-red);font-weight:bold">-${moneyFormat.format(item.amount)}</span>
                        </div>`;
                });
            }
        }

        function updateUI() {
            let totalIncome = incomesArr.reduce((a,b)=>a+b.amount,0);
            let totalExp = expensesArr.reduce((a,b)=>a+b.amount,0);
            let bal = totalIncome - totalExp;

            document.getElementById('displayIncome').innerText = moneyFormat.format(totalIncome);
            document.getElementById('displayExpenses').innerText = moneyFormat.format(totalExp);
            document.getElementById('displayBalance').innerText = moneyFormat.format(bal);
            document.getElementById('displayBalance').className = bal < 0 ? 'stat-value val-red' : 'stat-value val-green';
            
            myChart.data.datasets[0].data = [totalIncome, totalExp, bal]; myChart.update();
            renderLists();
        }

        function openPreview() {
            let totalIncome = incomesArr.reduce((a,b)=>a+b.amount,0);
            let totalExp = expensesArr.reduce((a,b)=>a+b.amount,0);
            document.getElementById('repInc').innerText = moneyFormat.format(totalIncome);
            document.getElementById('repExp').innerText = moneyFormat.format(totalExp);
            document.getElementById('repBal').innerText = moneyFormat.format(totalIncome - totalExp);
            document.getElementById('reportDate').innerText = "Fecha: " + new Date().toLocaleDateString();

            let htmlInc = `<table class="preview-table"><thead><tr><th>Fuente</th><th>Cat</th><th>Monto</th></tr></thead><tbody>`;
            [...incomesArr].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(i => {
                htmlInc += `<tr><td>${i.desc}</td><td>${i.category||'-'}</td><td style="color:#00d26a !important">${moneyFormat.format(i.amount)}</td></tr>`;
            });
            htmlInc += `</tbody></table>`;
            document.getElementById('incomesTableBody').innerHTML = htmlInc;

            let htmlExp = `<table class="preview-table"><thead><tr><th>Concepto</th><th>Cat</th><th>Monto</th></tr></thead><tbody>`;
            [...expensesArr].sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(i => {
                htmlExp += `<tr><td>${i.desc}</td><td>${i.category||'-'}</td><td style="color:#f73859 !important">${moneyFormat.format(i.amount)}</td></tr>`;
            });
            htmlExp += `</tbody></table>`;
            document.getElementById('expensesTableBody').innerHTML = htmlExp;

            document.getElementById('previewModal').style.display = 'flex';
        }
        function closePreview() { document.getElementById('previewModal').style.display = 'none'; }

        // --- FUNCIÓN CLONADO (SOLUCIÓN DEFINITIVA DE CORTE) ---
        function downloadPDF() {
            // 1. Clonar el contenido que queremos imprimir
            const originalElement = document.getElementById('pdfExportArea');
            const clonedElement = originalElement.cloneNode(true);

            // 2. Crear un contenedor temporal invisible y pegado a la izquierda (0,0)
            const container = document.createElement('div');
            container.style.position = 'absolute';
            container.style.top = '0';
            container.style.left = '0';
            container.style.width = '750px'; // Ancho fijo perfecto para Carta
            container.style.zIndex = '-9999'; // Detrás de todo
            container.style.background = '#1e1e2f'; // Asegurar fondo
            
            // Importante: Eliminar márgenes del clon para que no se mueva
            clonedElement.style.margin = '0';
            clonedElement.style.width = '100%';
            
            container.appendChild(clonedElement);
            document.body.appendChild(container);

            // 3. Configurar PDF
            const opt = {
                margin:       0.5,
                filename:     'Reporte_V3.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    backgroundColor: '#1e1e2f',
                    // Al usar el clon en (0,0), ya no necesitamos windowWidth ni trucos
                    scrollY: 0,
                    scrollX: 0
                }, 
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            // 4. Generar y limpiar
            html2pdf().set(opt).from(clonedElement).save().then(() => {
                document.body.removeChild(container);
            });
        }
    </script>
</body>
</html>
